<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tranquilicy - Neural Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="top-nav">
            <h1 class="logo">Tranquilicy <span>NEURAL GENERATOR</span></h1>
        </header>

        <main class="player-container">
            <div class="record-wrapper">
                <div class="record-plate">
                    <div class="record-center"></div>
                </div>
            </div>

            <div class="track-details">
                <h2 id="trackTitle" class="track-title">Ambient Serenity</h2>
                <p id="trackNetwork" class="track-subtitle">Neural Generation: Model 5500</p>
            </div>

            <div class="controls-wrapper">
                <div class="progress-area">
                    <span id="currentTime" class="time">0:00</span>
                    <div class="progress-bar-bg" id="progressBarBg">
                        <div class="progress-bar-fill" id="progressBarFill"></div>
                    </div>
                    <span id="totalTime" class="time">4:20</span>
                </div>

                <div class="buttons">
                    <button id="prevBtn" class="btn secondary-btn" aria-label="Previous">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
                    </button>
                    <button id="playBtn" class="btn primary-btn" aria-label="Play/Pause">
                        <span class="play-icon">
                            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        </span>
                    </button>
                    <button id="nextBtn" class="btn secondary-btn" aria-label="Next">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
                    </button>
                </div>
            </div>
        </main>
        
        <footer class="queue-container">
            <p class="queue-title">Up Next</p>
            <ul class="queue-list" id="queueList">
                <li class="queue-item active">
                    <span class="q-title">Ambient Serenity</span>
                </li>
                <li class="queue-item">
                    <span class="q-title">Golden Hour Drift</span>
                </li>
                <li class="queue-item">
                    <span class="q-title">Kyoto Rain</span>
                </li>
            </ul>
        </footer>
    </div>
    <script src="main.js"></script>
</body>
</html>
